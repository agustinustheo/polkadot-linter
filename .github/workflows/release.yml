name: Publish to crates.io

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify Cargo release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --component rustfmt --component clippy

      - name: Check tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="polkadot-linter") | .version')"
          test "$TAG" = "$PKG" || { echo "tag $TAG != Cargo.toml $PKG"; exit 1; }

      - name: Check formatting
        run: cargo +1.93.0 fmt --all -- --check

      - name: Run Clippy
        run: cargo +1.93.0 clippy --all-targets -- -D warnings

      - name: Test
        run: cargo +1.93.0 test --locked

      - name: Build release binary
        run: cargo +1.93.0 build --release --locked

      - name: Verify crates.io package
        run: cargo +1.93.0 publish --dry-run --locked

  publish:
    name: Publish package
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal

      - name: Publish to crates.io
        run: cargo +1.93.0 publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
