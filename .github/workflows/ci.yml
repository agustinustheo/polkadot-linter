name: CI

on:
  push:
    branches: [main, polkadot-linter-updates]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  polkadot-linter:
    name: Validate Polkadot Linter
    runs-on: ubuntu-latest
    env:
      POLKADOT_SDK_COMMIT: b18fb34a8ae348df5866e4b718d82871d744e60d
      MAX_SEC_BENCHMARK_FINDINGS: "13"
    steps:
      - name: Checkout repository and SDK submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install benchmark dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Verify pinned Polkadot SDK submodule
        run: |
          test -d .repos/polkadot-sdk
          test "$(git -C .repos/polkadot-sdk rev-parse HEAD)" = "$POLKADOT_SDK_COMMIT"

      - name: Install nightly formatter toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-06-10
          components: rustfmt,rustc-dev,llvm-tools-preview

      - name: Install build and test toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo +nightly-2025-06-10 fmt --all -- --check

      - name: Run Polkadot Linter tests
        run: cargo +1.93.0 test

      - name: Run Clippy
        run: cargo +1.93.0 clippy --all-targets -- -D warnings

      - name: Build Polkadot Linter binary
        run: cargo +1.93.0 build

      - name: Run rustc-backed hard-rule precision checks
        run: scripts/check-rustc-hard-rules.sh

      - name: Check default compiler-backed CLI routing
        run: scripts/check-rustc-cli-default.sh

      - name: Check rustc-backed SDK baseline
        run: scripts/check-rustc-sdk-smoke.sh .repos/polkadot-sdk .benchmarks

      - name: Check rustc-backed SDK SEC002 baseline
        run: scripts/check-rustc-sdk-sec002.sh .repos/polkadot-sdk .benchmarks

      - name: Check rustc-backed SDK SEC003 baseline
        run: scripts/check-rustc-sdk-sec003.sh .repos/polkadot-sdk .benchmarks

      - name: Check rustc-backed SDK SEC009 baseline
        run: scripts/check-rustc-sdk-sec009.sh .repos/polkadot-sdk .benchmarks

      - name: Check rustc-backed SDK SEC011 baseline
        run: scripts/check-rustc-sdk-sec011.sh .repos/polkadot-sdk .benchmarks

      - name: Check rustc-backed SDK SEC012 baseline
        run: scripts/check-rustc-sdk-sec012.sh .repos/polkadot-sdk .benchmarks

      - name: Check rustc-backed SDK SEC013 baseline
        run: scripts/check-rustc-sdk-sec013.sh .repos/polkadot-sdk .benchmarks

      - name: Check rustc-backed SDK SEC017 baseline
        run: scripts/check-rustc-sdk-sec017.sh .repos/polkadot-sdk .benchmarks

      - name: Check rustc-backed SDK SEC008 baseline
        run: scripts/check-rustc-sdk-sec008.sh .repos/polkadot-sdk .benchmarks

      - name: Check rustc-backed SDK SEC018 baseline
        run: scripts/check-rustc-sdk-sec018.sh .repos/polkadot-sdk .benchmarks

      - name: Benchmark SEC rules against Polkadot SDK
        run: scripts/benchmark-sec-rules.sh .repos/polkadot-sdk .benchmarks

      - name: Enforce SEC benchmark finding ceiling
        run: |
          latest="$(ls -t .benchmarks/sec-rules-*.json | head -n1)"
          count="$(jq 'length' "$latest")"
          echo "SEC benchmark findings: $count"
          test "$count" -le "$MAX_SEC_BENCHMARK_FINDINGS"

      - name: Check SEC benchmark validated baseline
        run: |
          latest="$(ls -t .benchmarks/sec-rules-*.json | head -n1)"
          scripts/check-sec-benchmark-baseline.sh "$latest"

      - name: Upload SEC benchmark output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec-rules-benchmark
          path: .benchmarks/
          include-hidden-files: true
