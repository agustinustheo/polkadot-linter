name: CI

on:
  push:
    branches: [main, polkadot-linter-updates]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  polkadot-linter:
    name: Validate Polkadot Linter
    runs-on: ubuntu-latest
    env:
      POLKADOT_SDK_COMMIT: b18fb34a8ae348df5866e4b718d82871d744e60d
    steps:
      - name: Checkout repository and SDK submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install benchmark dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Verify pinned Polkadot SDK submodule
        run: |
          test -d .repos/polkadot-sdk
          test "$(git -C .repos/polkadot-sdk rev-parse HEAD)" = "$POLKADOT_SDK_COMMIT"

      - name: Install Rust 1.91 driver toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-09-01

      - name: Install rustc driver components
        run: rustup component add --toolchain nightly-2025-09-01 rustfmt rustc-dev llvm-tools-preview

      - name: Install build and test toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo +nightly-2025-09-01 fmt --all -- --check

      - name: Run Polkadot Linter tests
        run: cargo +1.93.0 test

      - name: Run Clippy
        run: cargo +1.93.0 clippy --all-targets -- -D warnings

      - name: Build Polkadot Linter binary
        run: cargo +1.93.0 build

      - name: Run rustc-backed hard-rule precision checks
        run: scripts/check-rustc-hard-rules.sh

      - name: Check rustc-backed weight attributes
        run: scripts/check-rustc-weight-attributes.sh

      - name: Check default compiler-backed CLI routing
        run: scripts/check-rustc-cli-default.sh

      - name: Check rustc-backed VAL003 validation ordering
        run: scripts/check-rustc-val003.sh

      - name: Check rustc-backed SEM010 XOR detection
        run: scripts/check-rustc-sem010.sh

      - name: Check rustc-backed SEM009 storage cleanup detection
        run: scripts/check-rustc-sem009.sh

      - name: Check rustc-backed SEM006 DbWeight detection
        run: scripts/check-rustc-sem006.sh

      - name: Check rustc-backed SEM016 authorized-transaction detection
        run: scripts/check-rustc-sem016.sh

      - name: Check rustc-backed SDK benchmarks
        run: scripts/check-sdk-benchmarks.sh .repos/polkadot-sdk .benchmarks

      - name: Check source-rule FRAME corpus baseline
        run: scripts/check-source-rule-corpus.sh .repos/polkadot-sdk

      - name: Upload SEC benchmark output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec-rules-benchmark
          path: .benchmarks/
          include-hidden-files: true
