# polkadot-linter — Polkadot SDK-specific linter configuration

[general]
exclude = [".git/**", "target/**"]
include = []

[rules]
# Override individual rule enablement: rule_id = true/false
[rules.enabled]
# Every other rule is enabled. Evidence: benchmarks/precision/ (labeled
# findings on 10 third-party parachain repositories: moonbeam, astar, acala,
# hydration, centrifuge, kilt, peaq, the fellows runtimes, the OpenZeppelin
# templates and the parachain template). Counts are TP/sampled.
#
# 2026-10, 0/10 each. Parity SDK style conventions:
SEM002 = false
SEM003 = false
SEM004 = false
SEM012 = false
TST003 = false
# 2026-10, 0/10 each. False positives: RuntimeDebug is deprecated only from
# sp-debug-derive 15.0.0 (every flagged repository locks 14.0.0); public state
# and `.inner()` accessors; precompile test-harness assertions counted as mocks.
SEM007 = false
TST005 = false
MOK001 = false
# 2026-11, rule: off if TP < 30% or FP >= 30%.
# Mostly false positives: Ethereum ABI decoding read as SCALE (SEC003 0/10);
# genesis and `qed` code it claims to exclude (SEC008 0/12); validity and XCM
# errors read as dispatch results (TST001 0/12); SEC009 2/12, SEC001 1/4,
# VAL001 2/5.
SEC001 = false
SEC003 = false
SEC008 = false
SEC009 = false
TST001 = false
VAL001 = false
# Correct but not actionable: SEC004 0/4, SEC005 0/8, SEC016 0/9, SEM008 0/12
# (58% of all output), RTC004 1/12, SEC002 1/12, SEM005 1/12, VAL003 1/12,
# SEM006 3/12, BEN001 4/12 (misses runtime-hosted benchmarks).
BEN001 = false
RTC004 = false
SEC002 = false
SEC004 = false
SEC005 = false
SEC016 = false
SEM005 = false
SEM006 = false
SEM008 = false
VAL003 = false
# 2026-11 pre-merge review: SEC019 catches the dotUSD incident shape, but
# reviewers reproduced rare false positives (a move inside a nested block before
# a loop exit), so it stays opt-in until those are fixed.
SEC019 = false
# 2026-11 round 2 (benchmarks/precision/2026-11-run-audit: polkadot-sdk plus
# the 10 repositories above, compiler rules on 8 runtimes). No rule below
# caught any of 56 auditor-reported bugs in an audited-commit benchmark.
# TST004 0/15 (a test no SDK pallet writes); SEC013 0/15 (only flags
# `without_storage_info` pallets); SEC017 0/15 and SEC018 2/15 (bounded
# elsewhere or priced by length fees); VAL002 0/10 (`Get` constant divisors);
# SEC014 0/6 (sequential indices); SEC007 2/15 (`let _ =` is an explicit
# discard, and it skips dispatchable bodies).
SEC007 = false
SEC013 = false
SEC014 = false
SEC017 = false
SEC018 = false
TST004 = false
VAL002 = false

# Override individual rule severity: rule_id = "advisory"|"warning"|"error"
[rules.severity]
# TST002 (assert_ok on apply_extrinsic) is error-level because it silently hides failures
TST002 = "error"
# If re-enabled, keep these as review hints rather than warnings.
SEC005 = "advisory"
SEM008 = "advisory"
# SDK sample: VAL002 3/3 findings were non-actionable; if re-enabled, keep it
# as a review hint without treating config constants as warnings.
VAL002 = "advisory"

# ---------------------------------------------------------------------------
# Rule family: Validation order (VAL001)
# ---------------------------------------------------------------------------
[validation_order]
severity = "warning"

# Known expensive/heavy operations — Polkadot SDK storage reads
heavy_operations = [
	"::contains_key(",
	"::count(",
	"::decode_len(",
	"::get(",
	"::iter(",
	"::iter_keys(",
	"::iter_prefix(",
	"::try_get(",
	"CountedStorageMap::get",
	"StorageDoubleMap::get",
	"StorageMap::get",
	"StorageNMap::get",
	"StorageValue::get",
	"T::DbWeight::get()",
]

# Known cheap validation operations
cheap_validations = [
	".is_empty()",
	".is_none()",
	".is_some()",
	".is_zero()",
	"ensure!",
	"ensure_none",
	"ensure_root",
	"ensure_signed",
]

# ---------------------------------------------------------------------------
# Rule family: Test smells (TST001-TST006)
# ---------------------------------------------------------------------------
[test_smells]
severity = "warning"

# Patterns in assertions that suggest testing implementation details
internal_field_patterns = [
	'\._\w+',      # underscore-prefixed private fields
	'\.buffer\b',
	'\.cache\b',
	'\.counter\b',
	'\.flag\b',
	'\.inner\b',
	'\.state\b',
]

# ---------------------------------------------------------------------------
# Rule family: Mock usage (MOK001)
# ---------------------------------------------------------------------------
[mock_usage]
severity = "warning"
max_mock_expectations = 10
max_mock_ratio = 3.0

mock_patterns = [
	"MOCK",
	"Mock",
	"MockBuilder",
	"mock",
	"new_test_ext",
	"with_mock",
]

# ---------------------------------------------------------------------------
# Rule family: Benchmarking compliance (BEN001-BEN003)
# ---------------------------------------------------------------------------
[benchmarking]
severity = "warning"

verification_patterns = [
	"assert_has_event",
	"assert_last_event",
	"verify",
]

# ---------------------------------------------------------------------------
# Rule family: Runtime configuration (RTC001-RTC010)
# ---------------------------------------------------------------------------
# These rules only inspect runtime crates: the Cargo package whose library
# target (`[lib] path`, default src/lib.rs) or a module reachable from it
# declares `construct_runtime!`, `#[frame_support::runtime]` / `#[runtime]` or
# `#[frame_construct_runtime]`. `#[cfg(test)]` code (including `#[cfg(test)]
# mod x;` files), mock/tests/benches paths and test runtime crates are always
# skipped.
#
# No family-wide severity is set, so each rule keeps its own default: RTC003
# (XCM fees waived or delivery free) is error, the others are warning. Set
# `severity = "..."` here to override all of them, or use [rules.severity].
[runtime_config]

# Development runtimes are skipped unless include_dev_runtimes = true. They
# deliberately use placeholder weights, zero deposits and free XCM delivery.
include_dev_runtimes = false
dev_runtime_packages = [
	"kitchensink-runtime",
	"pallet-staking-async-parachain-runtime",
	"pallet-staking-async-rc-runtime",
	"penpal-runtime",
	"rococo-parachain-runtime",
	"yet-another-parachain-runtime",
]
# A runtime whose package or crate-directory name has one of these whole name
# tokens is also a dev runtime: `peaq-dev`, `development-runtime`, but not
# `devops-runtime`. Add project-specific dev or testnet runtimes (e.g.
# `mandala-runtime`, `moonbase-runtime`) to dev_runtime_packages.
dev_runtime_tokens = ["dev", "development"]

# Test runtimes are always skipped. A package or crate directory is a test
# runtime when one of its name tokens (split on `-` and `_`) is listed here,
# e.g. `polkadot-test-runtime` or `xcm_mock_runtime`, but not
# `mychain-testnet-runtime`. Set to [] to lint every runtime.
test_runtime_tokens = ["test", "tests", "mock", "mocks"]

# RTC001: pallets whose `impl WeightInfo for ()` is a hand-written production
# weight source (equivocation reporting), so `type WeightInfo = ();` is intended.
unit_weight_info_allowlist = [
	"pallet_babe",
	"pallet_beefy",
	"pallet_grandpa",
]

# RTC001: also report upstream `<pallet>::weights::SubstrateWeight<Runtime>`
# bindings. Off by default: the pinned SDK's production runtimes and templates
# contain 13 such bindings (59 more in kitchensink), several of them deliberate
# (pallet_revive, pallet_state_trie_migration), so the signal is advisory only.
flag_substrate_weight = false
substrate_weight_severity = "advisory"

# ---------------------------------------------------------------------------
# Rule family: Terminology (TRM001)
# ---------------------------------------------------------------------------
[terminology]
severity = "advisory"
check_identifiers = false
check_strings = true

# Google English preferred spellings (forbidden -> preferred)
# Note: this project uses Google English, which is generally American English
# with some exceptions. Adjust as needed.
[terminology.british_english]
# These map non-preferred -> preferred spellings
# Uncomment and customise for your project:
# "optimisation" = "optimization"
# "initialise" = "initialize"
# "finalise" = "finalize"
# "colour" = "color"
# "behaviour" = "behavior"
# "favour" = "favor"

# Project-specific forbidden terms
[terminology.forbidden_terms]
# "substrate" = "Polkadot SDK"
