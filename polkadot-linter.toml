# Project-level configuration for polkadot-linter.

[general]
exclude = ["*.lock", ".git/**", "target/**"]
include = []

[rules.severity]
TST002 = "error"

[validation_order]
severity = "warning"
heavy_operations = [
	"::contains_key(",
	"::count(",
	"::decode_len(",
	"::get(",
	"::iter(",
	"::iter_keys(",
	"::iter_prefix(",
	"::try_get(",
	"CountedStorageMap::get",
	"StorageDoubleMap::get",
	"StorageMap::get",
	"StorageNMap::get",
	"StorageValue::get",
	"T::DbWeight::get()",
]
cheap_validations = [
	".is_empty()",
	".is_none()",
	".is_some()",
	".is_zero()",
	"ensure!",
	"ensure_none",
	"ensure_root",
	"ensure_signed",
]

[test_smells]
severity = "warning"
internal_field_patterns = [
	'\._\w+',
	'\.buffer\b',
	'\.cache\b',
	'\.counter\b',
	'\.flag\b',
	'\.inner\b',
	'\.state\b',
]

[mock_usage]
severity = "warning"
max_mock_expectations = 10
max_mock_ratio = 3.0
mock_patterns = [
	"MOCK",
	"Mock",
	"MockBuilder",
	"mock",
	"new_test_ext",
	"with_mock",
]

[benchmarking]
severity = "warning"
verification_patterns = [
	"assert_has_event",
	"assert_last_event",
	"verify",
]

[runtime_config]
include_dev_runtimes = false
dev_runtime_packages = [
	"kitchensink-runtime",
	"pallet-staking-async-parachain-runtime",
	"pallet-staking-async-rc-runtime",
	"penpal-runtime",
	"rococo-parachain-runtime",
	"yet-another-parachain-runtime",
]
test_runtime_tokens = ["test", "tests", "mock", "mocks"]
unit_weight_info_allowlist = [
	"pallet_babe",
	"pallet_beefy",
	"pallet_grandpa",
]
flag_substrate_weight = false
substrate_weight_severity = "advisory"

[terminology]
severity = "advisory"
check_identifiers = false
check_strings = true

[terminology.british_english]
# "optimisation" = "optimization"
# "initialise" = "initialize"

[terminology.forbidden_terms]
# "substrate" = "Polkadot SDK"
