# Project-level configuration for polkadot-linter.

[general]
exclude = [".git/**", "target/**"]
include = []

[rules.severity]
TST002 = "error"

[test_smells]
severity = "warning"

[runtime_config]
include_dev_runtimes = false
dev_runtime_packages = [
	"kitchensink-runtime",
	"pallet-staking-async-parachain-runtime",
	"pallet-staking-async-rc-runtime",
	"penpal-runtime",
	"rococo-parachain-runtime",
	"yet-another-parachain-runtime",
]
dev_runtime_tokens = ["dev", "development"]
test_runtime_tokens = ["test", "tests", "mock", "mocks"]

[terminology]
severity = "advisory"
check_identifiers = false
check_strings = true

[terminology.british_english]
# "optimisation" = "optimization"
# "initialise" = "initialize"

[terminology.forbidden_terms]
# "substrate" = "Polkadot SDK"
